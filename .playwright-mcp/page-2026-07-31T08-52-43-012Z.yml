              - blockquote [ref=e346]:
                - paragraph [ref=e347]: How might AI help multi-disciplinary teams make sense of information, present ideas, align on decisions, and review work more effectively?
              - paragraph [ref=e348]: A research paper becomes a Jira issue becomes a pull request — and every hop stays visible on one canvas.
              - paragraph [ref=e349]:
                - text: Built for the
                - link "UNSW AiSoc × Atlassian × Mistral hackathon" [ref=e350] [cursor=pointer]:
                  - /url: https://aisoc-atlassian-mistral.devpost.com/
                - text: . Event rules, judging criteria, and pitch narrative live in
                - link [ref=e351] [cursor=pointer]:
                  - /url: /tuannm3812/unsw-aisoc-hack-2026/blob/main/docs/STRATEGY.md
                  - code [ref=e352]: docs/STRATEGY.md
                - text: . The original product design spec (Context Canvas) lives in
                - link [ref=e353] [cursor=pointer]:
                  - /url: /tuannm3812/unsw-aisoc-hack-2026/blob/main/docs/DESIGN_SPEC.md
                  - code [ref=e354]: docs/DESIGN_SPEC.md
                - text: ; this README describes
                - strong [ref=e355]: what shipped
                - text: .
              - generic [ref=e356]:
                - heading "The problem we solve" [level=2] [ref=e357]
                - 'link "Permalink: The problem we solve" [ref=e358] [cursor=pointer]':
                  - /url: "#the-problem-we-solve"
              - paragraph [ref=e361]: Cross-disciplinary work loses its reasoning in the handoff. A scientist's finding is retyped into a ticket, the ticket loses the constraint that made it necessary, and the engineer implements something subtly wrong.
              - paragraph [ref=e362]:
                - strong [ref=e363]: "Persona:"
                - text: Priya (PM), Dr Aisha Khan (research scientist), and Marco (engineer) on one board — a multi-disciplinary team, not a single-role tool.
              - paragraph [ref=e364]:
                - strong [ref=e365]: "Insight:"
                - text: AI should package context, not replace judgment. Teammates dump research onto typed nodes; connecting those nodes to a task gives a human or an agent the full upstream lineage — quotes and page numbers included — on demand.
              - paragraph [ref=e366]:
                - strong [ref=e367]: "Solution (one sentence):"
                - text: A shared semantic canvas where connecting knowledge to a task auto-assembles a Mistral brief and exposes that same lineage to coding agents over MCP, then writes the result into a real Jira issue and back when a PR lands.
              - generic [ref=e368]:
                - heading "Eligibility" [level=2] [ref=e369]
                - 'link "Permalink: Eligibility" [ref=e370] [cursor=pointer]':
                  - /url: "#eligibility"
