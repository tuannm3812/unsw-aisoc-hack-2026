                - text: Every AI reasoning step in this project runs on
                - strong [ref=e374]: Mistral APIs only
                - text: (OCR + structured extraction + task briefs). No OpenAI, no Anthropic inside the product. Cursor appears in the live demo only as an
                - strong [ref=e375]: MCP client
                - text: consuming our tools — the models that write briefs and parse PDFs are Mistral. See
                - link [ref=e376] [cursor=pointer]:
