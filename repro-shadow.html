<!doctype html>
<html>
<head>
<link rel="stylesheet" href="/frontend/.next/static/css/app/layout.css">
<style>
  .probe { position: absolute; width: 80px; height: 40px; background: #fff; }
</style>
</head>
<body>
  <div class="probe shadow-[3px_3px_0_var(--border)]" id="p1" style="top:10px;left:10px">var(--border)</div>
  <div class="probe shadow-[3px_3px_0_#1B1712]" id="p2" style="top:10px;left:120px">hardcoded</div>
  <div id="p3" style="position:absolute;top:10px;left:230px;width:80px;height:40px;background:#fff;border:3px solid #1B1712;box-shadow:3px 3px 0 var(--border)">toast-style</div>
  <script>
    setTimeout(() => {
      const g = (id) => getComputedStyle(document.getElementById(id)).boxShadow;
      window.__result = { p1: g('p1'), p2: g('p2'), p3: g('p3') };
    }, 300);
  </script>
</body>
</html>
